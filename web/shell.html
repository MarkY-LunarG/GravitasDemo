<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGPU Hackathon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font: 16px system-ui, sans-serif;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #error {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }
      #error[hidden] {
        display: none;
      }
      #help {
        position: fixed;
        left: 12px;
        bottom: 12px;
        opacity: 0.6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="error" hidden></div>
    <div id="help">W: wireframe terrain · N: next scene</div>
    <script>
      // The application finds the canvas with the "#canvas" selector. GLFW uses Module.canvas.
      var Module = {
        canvas: document.getElementById('canvas'),
      };
      if (!navigator.gpu) {
        const element = document.getElementById('error');
        element.textContent = 'This browser does not support WebGPU';
        element.hidden = false;
      }
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
