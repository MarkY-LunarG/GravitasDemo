<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebGPU Terrain</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #ddd;
        font: 16px system-ui, sans-serif;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #error {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
      }
      #error[hidden] {
        display: none;
      }
      #help {
        position: fixed;
        left: 12px;
        bottom: 12px;
        opacity: 0.6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="error" hidden></div>
    <div id="help">W: wireframe terrain · N: next scene</div>
    <script type="module" src="/src/browser.ts"></script>
  </body>
</html>
